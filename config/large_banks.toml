# --- Treasury securities ------------------------------------------------------

[[fields]]
mdrm = "RCFD0211"
label = "U.S. Treasury securities, held-to-maturity, amortized cost (RC-B 1)"

[[fields]]
mdrm = "RCFD0213"
label = "U.S. Treasury securities, held-to-maturity, fair value (RC-B 1)"

[[fields]]
mdrm = "RCFD1286"
label = "U.S. Treasury securities, available-for-sale, amortized cost (RC-B 1)"

[[fields]]
mdrm = "RCFD1287"
label = "U.S. Treasury securities, available-for-sale, fair value (RC-B 1)"

[[fields]]
mdrm = "RCON0211"
label = "U.S. Treasury securities, held-to-maturity, amortized cost, domestic offices (RC-H 10)"

[[fields]]
mdrm = "RCON1287"
label = "U.S. Treasury securities, available-for-sale, fair value, domestic offices (RC-H 10)"

[[fields]]
mdrm = "RCFDB558"
label = "Quarterly average: U.S. Treasury and U.S. Government agency obligations, excluding MBS (RC-K 2)"

# --- Maturity and repricing (RC-B Memorandum 2.a) -----------------------------
# Covers Treasury, agency, municipal and other non-mortgage debt securities, and
# mortgage pass-throughs other than those backed by closed-end first-lien 1-4
# family residential mortgages. It is not all debt securities.

[[fields]]
mdrm = "RCFDA549"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: 3 months or less (RC-B M2.a.1)"

[[fields]]
mdrm = "RCFDA550"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: over 3 through 12 months (RC-B M2.a.2)"

[[fields]]
mdrm = "RCFDA551"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: over 1 through 3 years (RC-B M2.a.3)"

[[fields]]
mdrm = "RCFDA552"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: over 3 through 5 years (RC-B M2.a.4)"

[[fields]]
mdrm = "RCFDA553"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: over 5 through 15 years (RC-B M2.a.5)"

[[fields]]
mdrm = "RCFDA554"
label = "Non-mortgage debt securities etc., remaining maturity or repricing: over 15 years (RC-B M2.a.6)"

