# Treasury holdings, funding and capital for the largest U.S. commercial banks.
#
# Labels follow the Federal Reserve MDRM dictionary and FFIEC short
# definitions. Schedule/line references are from the 2026 FFIEC 031 and may
# differ in earlier years. Prefixes: RCFD/RCFA/RCFW = consolidated bank,
# RCON = domestic offices, RCFN = foreign offices. Units come from each filing.

[run]
start = "2011Q4"
end = "latest"
workers = 4
requests_per_hour = 2400   # FFIEC allows about 2,500 and suggests 1.5 s spacing

[output]
dir = "output"
name = "call_report_large_banks"
format = "xlsx"            # or "csv"

# --- Banks ------------------------------------------------------------------
# rssd_id: the Federal Reserve's institution identifier (search the FFIEC NIC).

[[banks]]
name = "JPMorgan Chase Bank, N.A."
rssd_id = 852218
fed_district = "New York"

[[banks]]
name = "Bank of America, N.A."
rssd_id = 480228
fed_district = "Richmond"

[[banks]]
name = "Citibank, N.A."
rssd_id = 476810
fed_district = "New York"

[[banks]]
name = "Wells Fargo Bank, N.A."
rssd_id = 451965
fed_district = "San Francisco"

[[banks]]
name = "U.S. Bank National Association"
rssd_id = 504713
fed_district = "Minneapolis"

[[banks]]
name = "Goldman Sachs Bank USA"
rssd_id = 2182786
fed_district = "New York"

[[banks]]
