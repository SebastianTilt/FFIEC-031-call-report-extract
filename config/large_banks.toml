# --- Capital ------------------------------------------------------------------
# The revised Schedule RC-R codes (RCFA/RCFW) start 2014-03-31 per the MDRM
# dictionary; earlier periods used different codes and are reported as missing.

[[fields]]
mdrm = "RCFD3210"
label = "Total bank equity capital (RC 27.a)"

[[fields]]
mdrm = "RCFA8274"
label = "Tier 1 capital (RC-R Part I 26)"

[[fields]]
mdrm = "RCFAP870"
label = "Tier 2 capital before deductions (RC-R Part I 44.a)"

[[fields]]
mdrm = "RCFA3792"
label = "Total capital (RC-R Part I 47.a)"

[[fields]]
mdrm = "RCFAA224"
label = "Total assets for the leverage ratio (RC-R Part I 30)"

[[fields]]
mdrm = "RCFA7204"
label = "Tier 1 leverage ratio (RC-R Part I 31)"

[[fields]]
mdrm = "RCFA7206"
label = "Tier 1 risk-based capital ratio, column A (RC-R Part I 50)"

[[fields]]
mdrm = "RCFW7206"
label = "Tier 1 risk-based capital ratio, column B: advanced approaches banks that exited parallel run (RC-R Part I 50)"
notes = "Bank-level, like every Call Report item. Earlier scripts mislabeled it 'Consolidated/HoldCo'."

[[fields]]
mdrm = "RCFAH015"
label = "Total leverage exposure (RC-R Part I 55.a)"
notes = "MDRM start date 2016-09-30."

[[fields]]
mdrm = "RCFAH036"
label = "Supplementary leverage ratio (RC-R Part I 55.b)"
notes = "MDRM start date 2016-09-30; the MDRM item name marks it advanced approaches only."
