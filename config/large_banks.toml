label = "Balances due from depository institutions in the U.S. (RC-A 2)"
notes = "In filings from 2018-06-30. Before that the MDRM dictionary lists it as a derived FFIEC 031 item, which is not in the filing."

[[fields]]
mdrm = "RCON0082"
label = "Balances due from depository institutions in the U.S., domestic offices (RC-A 2)"

[[fields]]
mdrm = "RCFD0070"
label = "Balances due from banks in foreign countries and foreign central banks (RC-A 3)"
notes = "In filings from 2018-06-30. Before that the MDRM dictionary lists it as a derived FFIEC 031 item, which is not in the filing."

[[fields]]
mdrm = "RCON0070"
label = "Balances due from banks in foreign countries and foreign central banks, domestic offices (RC-A 3)"

# --- Deposits -----------------------------------------------------------------

[[fields]]
