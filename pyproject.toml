[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "callreport-extract"
description = "Extract FFIEC Call Report data for selected banks, fields and quarters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
    "openpyxl>=3.1,<4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
callreport = "callreport.cli:main"

[tool.hatch.version]
path = "src/callreport/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/callreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
